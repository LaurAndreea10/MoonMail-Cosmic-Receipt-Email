<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b17">
  <meta name="robots" content="noindex">
  <title>MoonMail · Lost in orbit</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#29245b 0,#11152b 32%,#090b17 70%);color:#d9def5}
    main{width:min(100%,620px);padding:42px;border:1px solid #31385f;border-radius:28px;background:rgba(16,20,38,.88);box-shadow:0 30px 100px rgba(0,0,0,.45);text-align:center;backdrop-filter:blur(18px)}
    .moon{display:grid;width:86px;height:86px;margin:0 auto 24px;border-radius:50%;place-items:center;background:linear-gradient(145deg,#b8adff,#6f60ee);box-shadow:0 0 60px rgba(139,124,255,.45);color:#090b17;font-size:2.4rem;font-weight:900}
    small{color:#8b7cff;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:10px 0 12px;color:#fff;font-size:clamp(2rem,8vw,4rem);letter-spacing:-.055em}
    p{margin:0 auto 28px;max-width:460px;color:#929ac7;line-height:1.7}
    a{display:inline-flex;padding:12px 18px;border-radius:12px;background:#8b7cff;color:white;text-decoration:none;font-weight:900;box-shadow:0 14px 30px rgba(139,124,255,.26)}
  </style>
</head>
<body>
  <main>
    <div class="moon" aria-hidden="true">◐</div>
    <small>Error 404 · Deep space</small>
    <h1>Lost in orbit.</h1>
    <p>This MoonMail route does not exist, but Mission Control can take you back to the Receipt Studio.</p>
    <a href="./">Return to MoonMail</a>
  </main>
</body>
</html>
